      <path d="M150 70c18 14 22 34 20 60h-40c-2-26 2-46 20-60z" fill="#fff" stroke="#221E52" stroke-width="4"/><circle cx="150" cy="104" r="8" fill="${C.c}" stroke="#221E52" stroke-width="3"/>
      <path d="M130 118l-16 24h16M170 118l16 24h-16" fill="${C.p}" stroke="#221E52" stroke-width="3.5" stroke-linejoin="round"/><path d="M138 132l12 34 12-34" fill="${C.y}" stroke="#221E52" stroke-width="3"/></g>
    <text font-family="Lilita One, sans-serif" font-size="26" fill="#221E52" letter-spacing="2"><textPath href="#pt" startOffset="50%" text-anchor="middle">${top}</textPath></text>
    <text font-family="Nunito, sans-serif" font-weight="900" font-size="15" fill="#221E52" letter-spacing="1.5"><textPath href="#pb" startOffset="50%" text-anchor="middle">${bottom} · ${year}</textPath></text>
    ${[0, 1, 2].map(i => `<path transform="translate(${118 + i * 32 - 11} 226) scale(0.95)" d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z" fill="${i < stars ? C.y : '#D9D6F2'}" stroke="#221E52" stroke-width="1.6"/>`).join('')}
  </svg>`;
};

/* gauge ring */
ART.gauge = (frac, status, icon) => {
  const r = 30, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  const col = status === 'bad' ? '#FF4F5E' : status === 'warn' ? C.y : C.g;
  return `<svg viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="${r}" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.16)" stroke-width="8"/>
    <circle cx="37" cy="37" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 37 37)"/>
    <g transform="translate(22 22) scale(1.25)">${I[icon] || I.dot}</g></svg>`;
};

/* =====================================================================
   Animated sky (background canvas)
   ===================================================================== */
ART.sky = function (canvas) {
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, dpr = 1, mx = 0, my = 0, dim = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  let stars = [], shooting = [];
  const planets = [
    { a: 0.16, e: 0.38, T: 22, ph: 0.4, r: 9, c1: '#9AE6FF', c2: '#2C86C9' },
    { a: 0.26, e: 0.38, T: 36, ph: 2.1, r: 15, c1: '#FF9BB8', c2: '#C2366A' },
    { a: 0.37, e: 0.38, T: 52, ph: 4.0, r: 12, c1: '#7EF0A8', c2: '#1E9C58', moon: true },
    { a: 0.52, e: 0.38, T: 80, ph: 1.0, r: 26, c1: '#FFD98A', c2: '#D9862B', ring: true },
    { a: 0.68, e: 0.38, T: 120, ph: 3.2, r: 19, c1: '#B9A6FF', c2: '#5D43D3', bands: true },
    { a: 0.85, e: 0.38, T: 170, ph: 5.2, r: 14, c1: '#FFB27A', c2: '#D9621A' },
  ];
  const nebula = [
    { x: 0.82, y: 0.2, r: 0.42, c: 'rgba(255,92,138,0.20)', dx: 0.012 }, { x: 0.12, y: 0.82, r: 0.5, c: 'rgba(46,197,255,0.16)', dx: -0.01 },
    { x: 0.55, y: 0.55, r: 0.6, c: 'rgba(139,108,255,0.20)', dx: 0.006 }, { x: 0.95, y: 0.9, r: 0.35, c: 'rgba(62,208,126,0.10)', dx: 0.008 },
  ];
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(w * h / 3800);
    stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), z: Math.random(), s: rnd(0.5, 2.2), tw: rnd(0, 6.3), sp: rnd(0.6, 2.2), col: Math.random() < 0.12 ? (Math.random() < 0.5 ? '#FFE7A3' : '#BFE9FF') : '#FFFFFF' }));
  }
  addEventListener('resize', resize); resize();
  addEventListener('pointermove', e => { mx = e.clientX / w - 0.5; my = e.clientY / h - 0.5; });
  function planet(p, x, y, r) {
    if (p.ring) { ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35); ctx.beginPath(); ctx.ellipse(0, 0, r * 2.1, r * 0.6, 0, Math.PI, 0); ctx.strokeStyle = 'rgba(255,230,170,.75)'; ctx.lineWidth = r * 0.28; ctx.stroke(); ctx.restore(); }
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.15, x, y, r); g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
    if (p.bands) { ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,.22)'; for (let k = -2; k <= 2; k++) ctx.fillRect(x - r, y + k * r * 0.38 - r * 0.07, 2 * r, r * 0.14); ctx.restore(); }
    ctx.beginPath(); ctx.arc(x + r * 0.25, y + r * 0.2, r, 0, 7); ctx.save(); ctx.clip(); ctx.restore();
    ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.4, r * 0.22, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    if (p.ring) { ctx.save(); ctx.translate(x, y); ctx.rotate(-0.35); ctx.beginPath(); ctx.ellipse(0, 0, r * 2.1, r * 0.6, 0, 0, Math.PI); ctx.strokeStyle = 'rgba(255,230,170,.9)'; ctx.lineWidth = r * 0.28; ctx.stroke(); ctx.restore(); }
  }
  let last = 0;
  function frame(now) {
    const t = reduce ? 30 : now / 1000;
    if (!reduce && now - last < 30) { raf = requestAnimationFrame(frame); return; } last = now;
    const bg = ctx.createRadialGradient(w * 0.5, h * 0.35, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.85);
    bg.addColorStop(0, '#2A1A78'); bg.addColorStop(0.55, '#140F4A'); bg.addColorStop(1, '#080B26');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    nebula.forEach(n => { const x = (n.x + Math.sin(t * n.dx) * 0.05) * w, y = n.y * h, r = n.r * Math.max(w, h); const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, n.c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); });
    stars.forEach(s => {
      const px = ((s.x * w + mx * 30 * s.z + t * 4 * s.z) % w + w) % w, py = s.y * h + my * 30 * s.z;
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * s.sp + s.tw)); ctx.fillStyle = s.col;
      if (s.s > 1.8) { ctx.beginPath(); ctx.moveTo(px - s.s * 2, py); ctx.lineTo(px + s.s * 2, py); ctx.moveTo(px, py - s.s * 2); ctx.lineTo(px, py + s.s * 2); ctx.strokeStyle = s.col; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillRect(px - s.s / 2, py - s.s / 2, s.s, s.s);
    });
    ctx.globalAlpha = 1;
    // sun and orbits
    const scale = Math.min(w * 0.62, h * 1.2);
    const sx = w * 0.06 + mx * 14, sy = h * 0.14 + my * 14;
    const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, scale * 0.22); sg.addColorStop(0, 'rgba(255,214,110,.75)'); sg.addColorStop(0.35, 'rgba(255,140,60,.25)'); sg.addColorStop(1, 'rgba(255,120,60,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
    const sr = scale * 0.05 * (1 + 0.03 * Math.sin(t * 2));
    const sg2 = ctx.createRadialGradient(sx - sr * 0.3, sy - sr * 0.3, sr * 0.1, sx, sy, sr); sg2.addColorStop(0, '#FFF6C7'); sg2.addColorStop(1, '#FFB13B');
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fillStyle = sg2; ctx.fill();
    const tilt = 0.38, rot = 0.42;
    planets.forEach(p => {
      const A = p.a * scale * 1.55;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot); ctx.beginPath(); ctx.ellipse(0, 0, A, A * tilt, 0, 0, 7); ctx.restore();
      ctx.strokeStyle = 'rgba(200,190,255,.13)'; ctx.lineWidth = 1.2; ctx.stroke();
      const ang = p.ph + t * 2 * Math.PI / p.T;
      const ex = A * Math.cos(ang), ey = A * tilt * Math.sin(ang);
      const x = sx + ex * Math.cos(rot) - ey * Math.sin(rot), y = sy + ex * Math.sin(rot) + ey * Math.cos(rot);
      const r = p.r * (0.75 + 0.35 * (Math.sin(ang) + 1) / 2) * Math.max(0.7, Math.min(1.4, w / 1200));
      planet(p, x, y, r);
      if (p.moon) { const ma = t * 1.6; ctx.beginPath(); ctx.arc(x + Math.cos(ma) * r * 2, y + Math.sin(ma) * r * 0.9, r * 0.28, 0, 7); ctx.fillStyle = '#E8E6F6'; ctx.fill(); }
    });
    // little satellite drifting
    const st = (t * 0.03) % 1.3; const qx = w * (1.1 - st), qy = h * (0.72 - st * 0.25);
    ctx.save(); ctx.translate(qx, qy); ctx.rotate(Math.sin(t) * 0.2); ctx.fillStyle = '#FFC93C'; ctx.fillRect(-5, -5, 10, 10); ctx.fillStyle = '#2F7BFF'; ctx.fillRect(-19, -3, 12, 6); ctx.fillRect(7, -3, 12, 6); ctx.restore();
    // shooting stars
    if (!reduce && Math.random() < 0.012) shooting.push({ x: rnd(0.2, 1) * w, y: rnd(0, 0.4) * h, vx: -rnd(7, 12), vy: rnd(3, 5), life: 1 });
    shooting = shooting.filter(s => s.life > 0);
    shooting.forEach(s => { const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9); g.addColorStop(0, `rgba(255,255,255,${s.life})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.strokeStyle = g; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); ctx.stroke(); s.x += s.vx; s.y += s.vy; s.life -= 0.018; });
    if (dim > 0) { ctx.fillStyle = `rgba(8,11,38,${dim})`; ctx.fillRect(0, 0, w, h); }
    if (!reduce) raf = requestAnimationFrame(frame);
  }

    ${[[40, 60, '🔥 Help! Watch the forest fires!', 0], [520, 50, '🌙 Is there ice on the Moon?', 0.6], [40, 210, '🔴 Map Mars for the rovers!', 1.2], [540, 200, '🔭 Find far-away galaxies!', 1.8]].map(([x, y, t, dl]) => `<g class="screen-pop" style="animation-delay:${dl}s"><rect x="${x}" y="${y}" width="230" height="96" rx="12" fill="#0E0A33" stroke="#2EC5FF" stroke-width="5"/><foreignObject x="${x + 12}" y="${y + 12}" width="206" height="74"><div xmlns="http://www.w3.org/1999/xhtml" class="scrtext">${t}</div></foreignObject><circle cx="${x + 216}" cy="${y + 14}" r="6" fill="#FF5C8A" class="blink-dot"/></g>`).join('')}
    <g transform="translate(285 110)" class="wake">${ART.orbi(230, 'wow', 'hat-none').replace('<svg class="orbi"', '<svg class="orbi" x="0" y="0"')}</g>
  </svg>`,
  // 4: Orbi points at the player
  () => `<svg viewBox="0 0 800 450" class="scene" aria-hidden="true"><rect width="800" height="450" fill="#140E45"/>${starField(40, 5)}
    <circle cx="400" cy="250" r="200" fill="url(#spot)"/><defs><radialGradient id="spot"><stop offset="0" stop-color="#FFE27A" stop-opacity=".45"/><stop offset="1" stop-color="#FFE27A" stop-opacity="0"/></radialGradient></defs>
    <g transform="translate(300 110)" class="zoom-in">${ART.orbi(200, 'happy', 'hat-none').replace('<svg class="orbi"', '<svg class="orbi" x="0" y="0"')}</g>
    ${[[180, 120], [620, 300], [210, 330], [640, 90]].map(([x, y], i) => `<path class="tw" style="animation-delay:${i * 0.4}s" d="M${x} ${y - 16}l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#FFC93C"/>`).join('')}
    <g class="badge-pop"><rect x="560" y="80" width="200" height="70" rx="35" fill="#FF5C8A" stroke="#221E52" stroke-width="5"/><text x="660" y="125" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="28" fill="#fff">YOU!</text></g>
  </svg>`,
  // 5: rocket lifts off
  () => `<svg viewBox="0 0 800 450" class="scene" aria-hidden="true"><rect width="800" height="450" fill="#1A1152"/>${starField(60, 11)}
    <path d="M0 400 Q400 360 800 400 V450 H0z" fill="#0E0A33"/>
    <g class="liftoff"><path d="M400 120 q30 40 30 120 v60 h-60 v-60 q0 -80 30 -120z" fill="#fff" stroke="#221E52" stroke-width="6"/><circle cx="400" cy="210" r="16" fill="#2EC5FF" stroke="#221E52" stroke-width="5"/>
      <path d="M370 260 l-30 50 h30z M430 260 l30 50 h-30z" fill="#FF5C8A" stroke="#221E52" stroke-width="5" stroke-linejoin="round"/>
      <path class="flame" d="M378 300 q22 90 44 0z" fill="#FFC93C" stroke="#FF8A3D" stroke-width="5"/></g>
    <g class="smoke">${[0, 1, 2, 3, 4, 5].map(i => `<circle cx="${300 + i * 40}" cy="${400 - (i % 2) * 10}" r="${30 + (i % 3) * 8}" fill="#E4E1FA" opacity=".85"/>`).join('')}</g>
  </svg>`,
];
ART.scene = i => (SCENES[i] || SCENES[0])();
ART.SCENE_COUNT = SCENES.length;


/* ---------- photos sent home by the spacecraft (drawn fresh each time) ---------- */
ART.photo = (kind, seed, blur = 0, heat = false) => {
  let x = (seed % 233280 + 233280) % 233280 || 7; const r = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const R = (a, b) => a + r() * (b - a), id = 'p' + seed + kind.length + (heat ? 'h' : '');
  let g = '';
  if (kind === 'earth' || kind === 'fire') {
    if (heat) {
      g += `<rect width="240" height="160" fill="#140A2A"/>`;
      for (let i = 0; i < 40; i++) g += `<circle cx="${R(0, 240)}" cy="${R(0, 160)}" r="${R(6, 22)}" fill="#2B1550" opacity=".6"/>`;
      const fx = R(50, 190), fy = R(40, 120);
      for (let i = 0; i < 9; i++) { const a = R(0, 6.3), d = R(0, 26); g += `<circle cx="${fx + Math.cos(a) * d}" cy="${fy + Math.sin(a) * d * 0.6}" r="${R(3, 9)}" fill="${['#FF4F5E', '#FF8A3D', '#FFE27A'][i % 3]}"/>`; }
      g += `<circle cx="${fx}" cy="${fy}" r="5" fill="#fff"/>`;
    } else {
      g += `<rect width="240" height="160" fill="${kind === 'fire' ? '#3F7D3A' : '#2E6FD8'}"/>`;
      if (kind === 'earth') { g += `<path d="M${R(-20, 40)} 160 C ${R(30, 90)} ${R(60, 120)}, ${R(80, 160)} ${R(0, 60)}, 260 ${R(10, 70)} V160z" fill="#4E9A4A"/>`; for (let i = 0; i < 14; i++) g += `<rect x="${R(80, 230)}" y="${R(70, 150)}" width="${R(8, 18)}" height="${R(6, 14)}" fill="${['#9BC25A', '#C9B458', '#6FAF4E'][i % 3]}" opacity=".9"/>`;
        g += `<path d="M${R(90, 140)} 160 q ${R(-20, 20)} -40 ${R(10, 40)} -70 t ${R(20, 60)} -50" stroke="#5CC8FF" stroke-width="3" fill="none"/>`;
        for (let i = 0; i < 6; i++) g += `<rect x="${R(150, 210)}" y="${R(90, 140)}" width="3" height="3" fill="#E4E1FA"/>`; }
      else { for (let i = 0; i < 70; i++) g += `<circle cx="${R(0, 240)}" cy="${R(0, 160)}" r="${R(3, 7)}" fill="${['#2F6A2C', '#4C8F45', '#356E30'][i % 3]}"/>`;
        const fx = R(60, 180), fy = R(60, 120); g += `<path d="M${fx - 30} ${fy} q 15 -10 30 0 t 30 0" stroke="#FF8A3D" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M${fx - 28} ${fy} q 14 -6 28 0 t 28 0" stroke="#FFE27A" stroke-width="2" fill="none"/>`;
        for (let i = 0; i < 5; i++) g += `<ellipse cx="${fx + 10 + i * 18}" cy="${fy - 18 - i * 14}" rx="${16 + i * 6}" ry="${9 + i * 3}" fill="#B9B5C9" opacity="${0.55 - i * 0.07}"/>`; }
      for (let i = 0; i < 4; i++) g += `<ellipse cx="${R(0, 240)}" cy="${R(0, 160)}" rx="${R(18, 40)}" ry="${R(8, 16)}" fill="#fff" opacity=".75"/>`;
    }
  } else if (kind === 'aral') {
    // dry seabed (Aralkum), shrinking water, white salt flats, the Kokaral dam, dust and stranded ships
    g += `<rect width="240" height="160" fill="#D9B97A"/>`;
    for (let i = 0; i < 18; i++) g += `<ellipse cx="${R(0, 240)}" cy="${R(0, 160)}" rx="${R(10, 40)}" ry="${R(4, 14)}" fill="${['#E8D3A2', '#CBA765', '#F1E6CC'][i % 3]}" opacity=".8"/>`;
    g += `<path d="M${R(10, 40)} ${R(10, 30)} C ${R(60, 90)} 0, 120 ${R(20, 40)}, ${R(110, 130)} ${R(55, 70)} C 100 80, 40 75, 20 55 Z" fill="#2E8FCB"/>`;
    g += `<path d="M${R(120, 140)} ${R(70, 85)} h 6" stroke="#5B4632" stroke-width="5"/>`;
    g += `<path d="M${R(140, 170)} ${R(85, 100)} C 190 80, 230 110, 220 150 C 190 160, 150 150, 145 125 Z" fill="#F7F3EA" opacity=".95"/>`;
    g += `<path d="M${R(160, 190)} ${R(105, 125)} c 8 -6 18 -4 22 4 c -6 8 -16 8 -22 -4z" fill="#5CC8FF" opacity=".75"/>`;
    for (let i = 0; i < 3; i++) g += `<ellipse cx="${R(150, 230)}" cy="${R(20, 70)}" rx="${R(16, 30)}" ry="${R(6, 12)}" fill="#E6DCC4" opacity=".55"/>`;
    g += `<path d="M230 ${R(0, 20)} C 200 30, 220 50, 240 60" stroke="#3E9DD6" stroke-width="3" fill="none"/>`;
    if (heat) for (let i = 0; i < 3; i++) { const sx = R(60, 120), sy = R(95, 140); g += `<path d="M${sx} ${sy} l 9 0 l 3 -3 l -15 0 z" fill="#8E3A1A"/><path d="M${sx + 4} ${sy - 3} v -5" stroke="#5B4632" stroke-width="1.2"/>`; }
  } else if (kind === 'moon') {
    g += `<rect width="240" height="160" fill="#8E8A9C"/>`;
    for (let i = 0; i < 26; i++) { const cx = R(0, 240), cy = R(0, 160), rr = R(4, 26); g += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="#6E6A7E"/><circle cx="${cx + rr * 0.15}" cy="${cy + rr * 0.15}" r="${rr * 0.82}" fill="#7E7A8E"/>`; }
    const cx = R(70, 170), cy = R(50, 110); g += `<circle cx="${cx}" cy="${cy}" r="30" fill="#2A2738"/><circle cx="${cx + 6}" cy="${cy + 4}" r="24" fill="#1C1A28"/>`;
    if (heat) for (let i = 0; i < 6; i++) g += `<circle cx="${cx + R(-14, 18)}" cy="${cy + R(-10, 14)}" r="${R(1.5, 3)}" fill="#7DF0FF"/>`;
  } else if (kind === 'mars') {
    g += `<rect width="240" height="160" fill="#C9572E"/>`;
    for (let i = 0; i < 10; i++) g += `<path d="M${R(-20, 240)} ${R(0, 160)} q 20 -8 40 0 t 40 0" stroke="#E07A45" stroke-width="${R(2, 5)}" fill="none" opacity=".8"/>`;
    g += `<path d="M-10 ${R(60, 100)} C 60 ${R(40, 120)}, 140 ${R(40, 120)}, 260 ${R(60, 100)}" stroke="#7A2E14" stroke-width="${R(14, 22)}" fill="none" opacity=".85"/>`;
    for (let i = 0; i < 8; i++) { const cx = R(0, 240), cy = R(0, 160), rr = R(4, 16); g += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="#A8441F"/><circle cx="${cx + 2}" cy="${cy + 2}" r="${rr * 0.75}" fill="#B9502A"/>`; }
    if (heat) { const rx = R(40, 200), ry = R(30, 130); g += `<rect x="${rx}" y="${ry}" width="5" height="4" fill="#E4E1FA"/><path d="M${rx - 30} ${ry + 9} h28" stroke="#8E3A1A" stroke-width="1.5" stroke-dasharray="2 2"/>`; }
  } else if (kind === 'jupiter') {
    const cols = ['#F2C38B', '#C98A4B', '#F7E1BC', '#B77A44', '#EBC79A', '#D9A066'];
    for (let i = 0; i < 9; i++) g += `<path d="M-10 ${i * 18 + R(-4, 4)} C 60 ${i * 18 + R(-8, 8)}, 160 ${i * 18 + R(-8, 8)}, 250 ${i * 18 + R(-4, 4)} V ${i * 18 + 24} H -10z" fill="${cols[i % cols.length]}"/>`;
    for (let i = 0; i < 6; i++) g += `<path d="M${R(0, 220)} ${R(10, 150)} q 10 -8 20 0 t 20 0" stroke="#FFF4DD" stroke-width="2" fill="none" opacity=".7"/>`;
    g += `<ellipse cx="${R(60, 180)}" cy="${R(60, 110)}" rx="30" ry="17" fill="#D0533A" stroke="#E8876A" stroke-width="4"/>`;
  } else {
    g += `<rect width="240" height="160" fill="#07051C"/>`;
    for (let i = 0; i < 80; i++) g += `<circle cx="${R(0, 240)}" cy="${R(0, 160)}" r="${R(0.4, 1.4)}" fill="#fff" opacity="${R(0.4, 1)}"/>`;
    const gx = R(70, 170), gy = R(50, 110), rot = R(0, 180);
    g += `<g transform="rotate(${rot} ${gx} ${gy})"><ellipse cx="${gx}" cy="${gy}" rx="46" ry="16" fill="#8B6CFF" opacity=".35"/><ellipse cx="${gx}" cy="${gy}" rx="26" ry="9" fill="#C9B8FF" opacity=".6"/><circle cx="${gx}" cy="${gy}" r="5" fill="#FFF4DD"/></g>`;
    for (let i = 0; i < 3; i++) g += `<ellipse cx="${R(0, 240)}" cy="${R(0, 160)}" rx="${R(6, 12)}" ry="${R(2, 5)}" fill="#FF9FC3" opacity=".5"/>`;
  }
  const b = Math.max(0, Math.min(6, blur));
  return `<svg viewBox="0 0 240 160" class="photo-img" aria-hidden="true"><defs><filter id="${id}" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="${b.toFixed(2)}"/></filter></defs><g filter="url(#${id})">${g}</g></svg>`;
};

root.ART = ART;
})(window);

</script>
<script>
/* =====================================================================
   Orbi's Mission Lab — progression and reward hooks
   Daily mission + streak (Wordle / Duolingo), levels and ranks, Stardust,
   cosmetic shop and capsules, Space Atlas cards (collect real missions),
   Orbi's quiz, star-gated mission map (Angry Birds).
   ===================================================================== */
'use strict';
(function (root) {
const H = {};

/* ---------- ranks ---------- */
H.RANKS = ['Space Cadet', 'Rocket Rookie', 'Orbit Explorer', 'Satellite Builder', 'Flight Engineer', 'Mission Specialist', 'Mission Commander', 'Space Admiral', 'Galaxy Legend'];
H.levelFor = xp => {
  let lvl = 1, need = 100, left = xp;
  while (left >= need) { left -= need; lvl++; need = 100 + (lvl - 1) * 60; }
  return { level: lvl, into: left, need, title: H.RANKS[Math.min(H.RANKS.length - 1, lvl - 1)] };
};

/* ---------- star gates (Easy mode) ---------- */
H.GATE = { firstlight: 0, wildfire: 1, aral: 2, lunarice: 2, sandbox: 2, l2survey: 4, mars: 5, jupiter: 7 };

/* ---------- cosmetic shop ---------- */
H.SHOP = [
  { id: 'paint-gold', kind: 'paint', name: 'Gold foil', price: 0, c: ['#FFC93C', '#DE9400'] },
  { id: 'paint-silver', kind: 'paint', name: 'Silver foil', price: 40, c: ['#E3E6F0', '#9CA3B8'] },
  { id: 'paint-ruby', kind: 'paint', name: 'Ruby red', price: 60, c: ['#FF5C6A', '#C0283A'] },
  { id: 'paint-mint', kind: 'paint', name: 'Mint green', price: 60, c: ['#5CF0B0', '#1E9C6E'] },
  { id: 'paint-ocean', kind: 'paint', name: 'Ocean blue', price: 80, c: ['#5CC8FF', '#1F7AC2'] },
  { id: 'paint-galaxy', kind: 'paint', name: 'Galaxy purple', price: 120, c: ['#A98BFF', '#5D43D3'] },
  { id: 'panel-blue', kind: 'panel', name: 'Classic blue cells', price: 0, c: ['#2F7BFF', '#7DB8FF'] },
  { id: 'panel-black', kind: 'panel', name: 'Midnight cells', price: 50, c: ['#2A2E4A', '#5B6190'] },
  { id: 'panel-gold', kind: 'panel', name: 'Golden cells', price: 90, c: ['#E0A300', '#FFE08A'] },
  { id: 'panel-pink', kind: 'panel', name: 'Bubblegum cells', price: 70, c: ['#FF7AB2', '#FFC2DD'] },
  { id: 'hat-none', kind: 'hat', name: 'No hat', price: 0 },
  { id: 'hat-party', kind: 'hat', name: 'Party hat', price: 50 },
  { id: 'hat-crown', kind: 'hat', name: 'Crown', price: 150 },
  { id: 'hat-cap', kind: 'hat', name: 'Propeller cap', price: 90 },
  { id: 'hat-helmet', kind: 'hat', name: 'Astronaut helmet', price: 120 },
  { id: 'hat-bow', kind: 'hat', name: 'Big bow', price: 60 },
  { id: 'trail-classic', kind: 'trail', name: 'Classic data sparks', price: 0, c: ['#2EC5FF', '#FFC93C', '#FF5C8A', '#3ED07E'] },
  { id: 'trail-rainbow', kind: 'trail', name: 'Rainbow sparks', price: 80, c: ['#FF4F5E', '#FF8A3D', '#FFC93C', '#3ED07E', '#2EC5FF', '#8B6CFF'] },
  { id: 'trail-ice', kind: 'trail', name: 'Ice sparks', price: 70, c: ['#E2F6FF', '#9AE6FF', '#5CC8FF'] },
  { id: 'trail-fire', kind: 'trail', name: 'Fire sparks', price: 70, c: ['#FFE08A', '#FF8A3D', '#FF4F5E'] },
];
H.item = id => H.SHOP.find(x => x.id === id);
H.CAPSULE_PRICE = 80;

/* ---------- Space Atlas: collect real missions and ideas ---------- */
// test(ctx) with ctx = { d, ev, r, m } after a successful launch
H.CARDS = [
  { id: 'iss', name: 'International Space Station', art: 'firstlight', hint: 'Fly 450 km high or lower', fact: 'The ISS flies about 410 km up and goes around Earth every 92 minutes. Astronauts see 16 sunrises a day!', test: c => c.d.orbit.dest === 'earth' && c.ev.orb.h <= 450 },
  { id: 'cubesat', name: 'The CubeSat', art: 'tool:cam', hint: 'Fly a CubeSat', fact: 'CubeSats are built from 10 cm cubes. The idea came from Cal Poly and Stanford universities in 1999, so students could build real satellites.', test: c => c.ev.cls === 'cube' },
  { id: 'dove', name: 'Dove imaging satellites', art: 'tool:cam', hint: 'Carry the little camera', fact: 'Planet\'s Dove satellites are shoebox-sized cameras. Hundreds of them work together to photograph Earth\'s land every day.', test: c => c.d.payload.includes('cam') },
  { id: 'falcon', name: 'Falcon 9', art: 'rocket:f9', hint: 'Launch on a Falcon 9 or a SpaceX rideshare', fact: 'Falcon 9 boosters land back on Earth and fly again. One booster has flown more than 35 times!', test: c => ['f9', 'f9x', 'rideSSO', 'rideMid', 'rideCube'].includes(c.d.launch.lv) },
  { id: 'electron', name: 'Electron', art: 'rocket:electron', hint: 'Launch on Electron', fact: 'Rocket Lab\'s Electron has 3D-printed engines with pumps driven by electric motors and batteries.', test: c => ['electron', 'photon'].includes(c.d.launch.lv) },
  { id: 'fire', name: 'Fire watchers', art: 'wildfire', hint: 'Carry a heat camera', fact: 'Hot fires glow brightly in infrared light, so heat cameras can spot them through smoke and at night.', test: c => c.d.payload.some(p => ['tirc', 'mwir'].includes(p)) },
  { id: 'swarm', name: 'Satellite swarms', art: 'firstlight', hint: 'Fly 6 or more satellites at once', fact: 'Many small satellites can check the same place again and again. Weather and imaging companies fly dozens or hundreds.', test: c => c.ev.N >= 6 },
  { id: 'belts', name: 'Van Allen belts', art: 'l2survey', hint: 'Fly between 1,000 and 25,000 km', fact: 'Explorer 1, America\'s first satellite (1958), discovered rings of trapped radiation around Earth. They are named after James Van Allen.', test: c => c.d.orbit.dest === 'earth' && c.ev.orb.h >= 1000 && c.ev.orb.h <= 25000 },
  { id: 'gps', name: 'GPS satellites', art: 'firstlight', hint: 'Fly a GPS-height orbit (about 20,200 km)', fact: 'About 31 GPS satellites fly 20,200 km up. Each lap takes 12 hours. Your phone listens to at least 4 of them to find where you are.', test: c => c.d.orbit.dest === 'earth' && Math.abs(c.ev.orb.h - 20200) < 1500 },
  { id: 'geo', name: 'Geostationary orbit', art: 'firstlight', hint: 'Fly a geostationary orbit', fact: 'At 35,786 km, a satellite circles Earth once a day, so it seems to hang still in the sky. Writer Arthur C. Clarke described the idea in 1945.', test: c => c.d.orbit.dest === 'earth' && !!c.d.orbit.geo },
  { id: 'capstone', name: 'CAPSTONE', art: 'lunarice', hint: 'Reach the Moon on Electron with Photon, or fly the halo orbit', fact: 'CAPSTONE was a 25 kg CubeSat that flew to the Moon in 2022 to test the orbit planned for NASA\'s Gateway station.', test: c => c.d.orbit.dest === 'moon' && (c.d.launch.lv === 'photon' || c.d.orbit.final === 'nrho') },
  { id: 'lro', name: 'Lunar Reconnaissance Orbiter', art: 'lunarice', hint: 'Reach a low orbit around the Moon', fact: 'LRO has mapped the Moon since 2009 and found craters near the poles colder than −240 °C, where ice can hide.', test: c => c.d.orbit.dest === 'moon' && /llo/.test(c.d.orbit.final) && c.m.opsDays > 0 },
  { id: 'jwst', name: 'James Webb Space Telescope', art: 'l2survey', hint: 'Reach Sun–Earth L2', fact: 'Webb floats 1.5 million km from Earth. Its sunshield is about as big as a tennis court and keeps the telescope colder than −220 °C.', test: c => c.d.orbit.dest === 'l2' && c.m.opsDays > 0 },
  { id: 'mro', name: 'Mars Reconnaissance Orbiter', art: 'mars', hint: 'Reach Mars orbit', fact: 'MRO\'s HiRISE camera can spot things on Mars as small as a kitchen table. MRO has sent home more data than any other Mars mission.', test: c => c.d.orbit.dest === 'mars' && c.m.opsDays > 0 },
  { id: 'aero', name: 'Aerobraking', art: 'mars', hint: 'Use Mars\'s air to brake', fact: 'Instead of burning fuel, some Mars orbiters dip into the thin upper air hundreds of times to slow down little by little.', test: c => c.ev.aerobrake && c.m.opsDays > 0 },
  { id: 'juno', name: 'Juno', art: 'jupiter', hint: 'Reach Jupiter', fact: 'Juno is solar-powered even at Jupiter, where sunlight is 27 times weaker. Its electronics ride inside a titanium radiation vault.', test: c => c.d.orbit.dest === 'jupiter' && c.m.opsDays > 0 },
  { id: 'dsn', name: 'Deep Space Network', art: 'tool:relay', hint: 'Talk home with NASA\'s giant dishes', fact: 'NASA has giant dishes in California, Spain and Australia, spaced so one can always see your spacecraft as Earth turns.', test: c => /dsn/.test(c.d.comms.gs) },
  { id: 'rtg', name: 'Nuclear batteries', art: 'tool:neutron', hint: 'Power a spacecraft with an MMRTG', fact: 'The Curiosity and Perseverance rovers on Mars run on MMRTGs: heat from decaying plutonium turned into about 110 watts.', test: c => c.d.power.src === 'rtg' },
  { id: 'laser', name: 'Laser communications', art: 'tool:lola', hint: 'Talk home with a laser', fact: 'Lasers squeeze data into a beam far narrower than radio, so they can send much more. NASA is testing laser links from the Moon and deep space.', test: c => c.d.comms.band === 'opt' },
  { id: 'aral', name: 'The Aral Sea', art: 'aral', hint: 'Complete the Aral Sea mission', fact: 'In 1960 the Aral Sea covered 68,000 km². By 2014 its eastern basin had dried up completely. Kazakhstan\'s Kokaral Dam (2005) helped the North Aral Sea grow again, and fish came back.', test: c => c.m.scen && c.m.scen.id === 'aral' && c.m.opsDays > 0 },
  { id: 'baikonur', name: 'Baikonur', art: 'soyuz', hint: 'Complete the Aral Sea mission (Baikonur is nearby!)', fact: 'Baikonur in Kazakhstan is the world\'s first spaceport. Sputnik 1 (1957) and Yuri Gagarin, the first person in space (1961), both launched from there.', test: c => c.m.scen && c.m.scen.id === 'aral' && c.m.opsDays > 0 },
  { id: 'junk', name: 'Space junk', art: 'firstlight', hint: 'Finish a low-orbit mission and clean up after it', fact: 'Tens of thousands of pieces of old satellites and rocket parts are tracked around Earth. New rules say low satellites must come down within 5 years after they finish.', test: c => E().isLEO(c.d) && c.m.compliant },
];
const E = () => root.ENGINE;

/* ---------- Orbi's quiz ---------- */
H.QUIZ = [
  ['How long does the space station take to go around Earth once?', ['About 92 minutes', 'One whole day', 'One week'], 0],
  ['Which planet has the strongest radiation belts?', ['Jupiter', 'Mars', 'Venus'], 0],
  ['Why do low satellites slowly fall down?', ['Thin air drags on them', 'Their batteries run out', 'The Moon pulls them'], 0],
  ['How strong is sunlight at Jupiter compared with Earth?', ['About 27 times weaker', 'Twice as strong', 'Exactly the same'], 0],
  ['What does a satellite\'s battery do?', ['Keeps it working in Earth\'s shadow', 'Makes it fly faster', 'Keeps it cold'], 0],
  ['How often do Earth and Mars line up for an easy trip?', ['Every 26 months', 'Every week', 'Every 10 years'], 0],
  ['What is a CubeSat built from?', ['10 cm cubes called "U"', 'Ice cubes', 'Sugar cubes'], 0],
  ['Why do engineers shake spacecraft before launch?', ['To check they survive the rocket ride', 'To mix the fuel', 'Just for fun'], 0],

  ['The thin air up there would pull our satellite down too soon.', 'Жоғарыдағы сирек ауа серігімізді тым ерте төмен тартады.', 'Разреженный воздух наверху слишком рано утянет спутник вниз.'],
  ['We need at least one science tool!', 'Бізге кемінде бір ғылыми құрал керек!', 'Нам нужен хотя бы один научный прибор!'],
  ['That tool is too big for this body.', 'Ол құрал бұл корпусқа тым үлкен.', 'Этот прибор слишком большой для этого корпуса.'],
  ["We need an engine to get where we're going.", 'Баратын жерімізге жету үшін бізге қозғалтқыш керек.', 'Чтобы добраться до цели, нам нужен двигатель.'],
  ['The rocket can barely lift us. Engineers like spare lifting power.', 'Зымыран бізді әрең көтереді. Инженерлер көтеру күшінің қорын жақсы көреді.', 'Ракета еле поднимает нас. Инженеры любят запас подъёмной силы.'],
  ['The infrared telescope must be super cold.', 'Инфрақызыл телескоп өте суық болуы керек.', 'Инфракрасный телескоп должен быть очень холодным.'],

  ['The shared rocket drops us somewhere else, and we have no engine to move.', 'Ортақ зымыран бізді басқа жерге тастайды, ал бізде жылжитын қозғалтқыш жоқ.', 'Общая ракета высадит нас в другом месте, а двигателя, чтобы переместиться, нет.'],
  ['One part is brand new and not tested much. It might cause delays.', 'Бір бөлшек мүлдем жаңа әрі аз сыналған. Ол кешігуге әкелуі мүмкін.', 'Одна деталь совсем новая и мало испытана. Это может вызвать задержки.'],
  ["Our radio and the ground antennas don't match.", 'Радиомыз бен жердегі антенналар сәйкес келмейді.', 'Наше радио и наземные антенны не подходят друг другу.'],

  // Orbi's fixes
  ['A nuclear battery only fits big spacecraft, so I went back to solar.', 'Ядролық батарея тек үлкен аппараттарға сияды, сондықтан күн қуатына қайттым.', 'Ядерная батарея подходит только большим аппаратам, поэтому я вернул солнечные панели.'],
  ['A sail is not enough this high, so we will use the engine to come home.', 'Бұл биіктікте желкен жеткіліксіз, сондықтан қайту үшін қозғалтқышты қолданамыз.', 'На такой высоте парус не справится, поэтому вернёмся с помощью двигателя.'],

  ['I added a big dish antenna. Far from Earth, a dish works like a megaphone.', 'Үлкен табақ антенна қостым. Жерден алыста табақ рупор сияқты жұмыс істейді.', 'Я добавил большую антенну-тарелку. Вдали от Земли тарелка работает как рупор.'],
  ['I added another nuclear battery.', 'Тағы бір ядролық батарея қостым.', 'Я добавил ещё одну ядерную батарею.'],

  ['I added spinning reaction wheels so the spacecraft can point exactly where it needs to.', 'Аппарат керек жерге дәл бағытталуы үшін айналатын маховиктер қостым.', 'Я добавил вращающиеся маховики, чтобы аппарат точно наводился куда нужно.'],
  ["I booked NASA's biggest 70 m dishes.", 'NASA-ның ең үлкен 70 метрлік табақтарын брондадым.', 'Я забронировал самые большие 70-метровые антенны NASA.'],
  ['I made the wings turn to follow the Sun.', 'Қанаттарды Күннің соңынан бұрылатын қылдым.', 'Я сделал так, чтобы крылья поворачивались за Солнцем.'],

    const ok = !R.issues.some(i => i.sev === 'block' && /lift|rideshare|CubeSats only|fairing|dispenser|beyond Earth orbit|drops you/.test(i.msg)) && (!needMargin || R.mass.margin >= E.DIFF[st.diff].massMargin);

}

    const sg = base.sci.value > 0 ? R.sci.value / base.sci.value - 1 : 0;
